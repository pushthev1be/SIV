<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIV · Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212; --panel: #1a1a1a; --panel-2: #222222; --line: #2e2e2e;
    --text: #ececec; --soft: #bdbdbd; --muted: #8a8a8a; --ok: #6fbf73; --warn: #e8b04a;
    --display: "Barlow Condensed", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    --body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 400 14px/1.5 var(--body); min-height: 100vh;
         background: linear-gradient(to bottom, rgba(18,18,18,.15) 0, rgba(18,18,18,.94) 340px), #bfe6f5 url("assets/siv-wallpaper.png") center top / cover fixed no-repeat; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font: 700 28px var(--display); letter-spacing: .06em; margin: 0; }
  h1 span { color: var(--muted); font-weight: 500; }
  header a { color: var(--soft); font: 500 13px var(--mono); text-decoration: none; border: 1px solid var(--line); padding: 4px 10px; border-radius: 6px; }
  .lede { color: var(--soft); max-width: 760px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .big { font: 700 40px/1 var(--display); letter-spacing: .02em; }
  .card .big small { font: 500 16px var(--mono); color: var(--muted); }
  .card .lbl { color: var(--soft); margin-top: 6px; font-size: 13px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  h2 { font: 700 18px var(--display); letter-spacing: .05em; margin: 0 0 4px; }
  h2 b { color: var(--muted); font-weight: 500; margin-right: 6px; }
  section p { color: var(--soft); margin: 0 0 10px; max-width: 820px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 7px 8px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; border-top: 0; }
  td.n { font: 600 13px var(--mono); text-align: right; white-space: nowrap; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .note { border-left: 2px solid var(--warn); padding: 6px 12px; color: var(--soft); background: var(--panel-2); border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 13px; }
  footer { color: var(--muted); font: 500 12px var(--mono); margin-top: 24px; }
  @media (max-width: 600px) { .card .big { font-size: 32px; } td, th { padding: 6px 4px; } }
</style>
</head>
<body>
<main>
  <header><h1>SIV <span>· EVALUATION</span></h1><a href="index.html">← Back to the match</a></header>
  <p class="lede">How far you can trust it, in numbers. In a simulated match the truth is known, because the script sets every margin, so every measurement and every flag can be marked right or wrong. Every number here is reproducible with <code>scripts/evaluate.py</code>.</p>
  <div class="grid" id="cards"></div>
  <div id="sections"><section><p>Loading…</p></section></div>
  <footer id="foot"></footer>
</main>
<script>
(async () => {
  const r = await fetch("data/eval.json", { cache: "no-cache" }).then((x) => x.json()).catch(() => null);
  if (!r) { document.getElementById("sections").innerHTML = "<section><p>No evaluation yet: run <code>uv run python scripts/evaluate.py</code>.</p></section>"; return; }
  const m = r.measurement, t = r.red_team, s = r.spoilers, d = r.desk;
  const pct = (a, b) => (b ? (100 * a / b).toFixed(1) + "%" : "n/a");
  const errors = m.errors_flagged + m.errors_missed, correct = m.false_flags + m.correct_unflagged;
  const card = (big, lbl) => `<div class="card"><div class="big">${big}</div><div class="lbl">${lbl}</div></div>`;
  document.getElementById("cards").innerHTML = [
    card(`${m.mean_error_cm}<small> cm</small>`, `mean measurement error over ${m.measured} measured calls in ${m.matches} matches`),
    card(`${m.errors_flagged}<small>/${errors}</small>`, `wrong VAR decisions flagged; ${m.false_flags} correct calls flagged by mistake`),
    card(pct(t.caught, t.planted), `of ${t.planted.toLocaleString()} planted errors caught by the fact checker; ${t.clean_rejected} clean texts rejected`),
    card(`${s.reveals}<small>/${s.during_packages}</small>`, "replays during a check that gave anything away"),
  ].join("");
  const row = (a, b, n) => `<tr><td>${a}</td><td class="n">${b}</td>${n != null ? `<td><div class="bar"><i style="width:${n}%"></i></div></td>` : "<td></td>"}</tr>`;
  const kinds = Object.entries(t.by_kind).map(([k, v]) => row(k.replace(/_/g, " "), `${v.caught} / ${v.planted}`, 100 * v.caught / v.planted)).join("");
  const missed = (t.by_kind.changed_number?.planted || 0) - (t.by_kind.changed_number?.caught || 0);
  document.getElementById("sections").innerHTML = `
    <section><h2><b>1</b>Measurement accuracy</h2>
      <p>Offside margins, the ball over the line, where contact started at the edge of the area, the keeper off his line: the engine's measurement against the value the script set.</p>
      <table><tr><th>Check</th><th style="text-align:right">Result</th><th></th></tr>
      ${row("Mean error", m.mean_error_cm + " cm")}${row("Largest error", m.max_error_cm + " cm")}
      ${row("Calls where the measurement pointed the wrong way", `${m.direction_wrong} of ${m.measured}`)}</table></section>
    <section><h2><b>2</b>Catching the VAR's mistakes</h2>
      <p>A decision is wrong when its own measurement contradicts it: offside given against a player who was onside, a goal allowed though he was off, a penalty refused when the challenger never touched the ball. Each should be flagged; no correct call should be.</p>
      <table><tr><th>Check</th><th style="text-align:right">Result</th><th></th></tr>
      ${row("Wrong decisions flagged", `${m.errors_flagged} of ${errors}`, 100 * m.errors_flagged / Math.max(1, errors))}
      ${row("Correct decisions flagged by mistake", `${m.false_flags} of ${correct}`)}</table>
      <div class="note">On real data the same rule holds, honestly applied: event data places the ball to about 10 cm, so for Japan v Spain the system says it can't settle a call decided by millimetres, rather than inventing a margin.</div></section>
    <section><h2><b>3</b>Fact-checker red team</h2>
      <p>Every explanation the engine writes, for every audience, in every match, with one error planted at a time. The Verifier is plain code: nothing it rejects can air.</p>
      <table><tr><th>Planted error</th><th style="text-align:right">Caught / planted</th><th></th></tr>${kinds}
      ${row("<b>All</b>", `<b>${t.caught} / ${t.planted}</b>`, 100 * t.caught / t.planted)}
      ${row("Clean texts wrongly rejected", `${t.clean_rejected} of ${t.texts}`)}</table>
      <div class="note">What it misses: it checks that a number is <i>in the facts</i>, not that it's attached to the <i>right</i> fact. All ${missed} changed numbers it let through were swapped for a number that really is elsewhere in the same call's facts (another player's speed, a clock time).</div></section>
    <section><h2><b>4</b>No spoilers while a check is open</h2>
      <p>While VAR is still looking, fans see what is being checked and under which law, never the margin or the answer.</p>
      <table>${row("Replays shown during a check", s.during_packages)}${row("Carrying a measurement, margin or verdict", s.reveals)}</table></section>
    <section><h2><b>5</b>The agent desk</h2>
      <p>Microsoft Agent Framework on Foundry (${d.model}). A Decision Desk agent reads the call over MCP and writes it; a code Verifier checks it; four persona agents (fan, analyst, Spanish, Ref Buddy) rewrite it in parallel, each checked by code and then by an Editor agent for meaning. ${d.calls} VAR calls, cached for the demo.</p>
      <table><tr><th>Check</th><th style="text-align:right">Result</th><th></th></tr>
      ${row("Decision Desk drafts passing the Verifier first time", `${d.desk_first_pass} of ${d.desk_unplanted}`, 100 * d.desk_first_pass / Math.max(1, d.desk_unplanted))}
      ${row("Planted wrong numbers caught", `${d.planted_caught} of ${d.planted}`, 100 * d.planted_caught / Math.max(1, d.planted))}
      ${row("Audience versions rescued by a retry", `${d.recovered_on_retry} of ${d.variants}`)}
      ${row("Rewrites the Editor sent back (meaning changed)", d.editor_catches)}
      ${row("Fallbacks to the engine's own text", d.fallbacks)}
      ${row("Time per call, whole workflow", `median ${d.median_s} s, longest ${d.max_s} s`)}</table>
      <div class="note">A fallback is the system working: when an agent can't produce a grounded text in two tries, the engine's deterministic explanation airs instead, so no fan ever sees an unchecked claim.</div></section>`;
  document.getElementById("foot").textContent = `Generated ${r.generated} · scripts/evaluate.py · simulated matches are seeded; agent numbers come from the cached workflow traces.`;
})();
</script>
</body>
</html>
