<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touchline Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121922;
    --panel-2: #18212c;
    --line: #243140;
    --text: #e8eef4;
    --muted: #8a9bad;
    --pitch: #14432b;
    --pitch-2: #174d31;
    --chalk: rgba(255, 255, 255, 0.55);
    --nbr: #F2B33D;
    --ash: #5AA9E6;
    --var: #c084fc;
    --alert: #f87171;
    --ok: #4ade80;
    --display: "Barlow Condensed", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
  body { min-height: 100vh; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 12px;
          grid-template-columns: minmax(0, 1fr) 320px; grid-template-areas: "top top" "pitch side" "ctrl side"; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; grid-template-areas: "top" "pitch" "ctrl" "side"; } }

  /* Scorebug */
  .top { grid-area: top; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bug { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; overflow: hidden; font-family: var(--display); font-size: 26px; font-weight: 700; }
  .bug .team { display: flex; align-items: center; gap: 8px; padding: 6px 12px; letter-spacing: .04em; }
  .bug .score { font-family: var(--mono); font-weight: 600; background: var(--panel-2); padding: 6px 14px; display: flex; align-items: center; }
  .bug .clock { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--muted); padding: 6px 12px;
                display: flex; align-items: center; border-left: 1px solid var(--line); min-width: 92px; justify-content: center; }
  .crest { width: 22px; height: 26px; }
  .brand { margin-left: auto; font-family: var(--display); font-size: 20px; letter-spacing: .12em; color: var(--muted); }
  .brand b { color: var(--text); }
  .meters { display: flex; gap: 18px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .meter { display: grid; gap: 4px; min-width: 150px; }
  .meter .bar { height: 6px; border-radius: 3px; background: var(--ash); overflow: hidden; display: flex; }
  .meter .bar i { display: block; height: 100%; background: var(--nbr); transition: width .4s; }
  .meter .vals { display: flex; justify-content: space-between; font-family: var(--mono); }

  /* Pitch */
  .stage { grid-area: pitch; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  svg.pitch { width: 100%; height: auto; display: block; border-radius: 4px; }
  .badge { position: absolute; top: 18px; right: 18px; font-family: var(--display); font-weight: 700; font-size: 18px;
           letter-spacing: .08em; padding: 6px 12px; border-radius: 4px; background: var(--var); color: #1a0b2e;
           display: none; align-items: center; gap: 8px; }
  .badge.on { display: flex; }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #1a0b2e; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .band { position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; align-items: stretch;
          transform: translateY(12px); opacity: 0; transition: all .3s; pointer-events: none; }
  .band.on { transform: none; opacity: 1; }
  .band .tag { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
               padding: 8px 14px; background: var(--nbr); color: #1d1405; border-radius: 4px 0 0 4px; display: flex; align-items: center; }
  .band .text { flex: 1; background: rgba(11, 15, 20, .92); padding: 8px 14px; font-size: 16px; border-radius: 0 4px 4px 0;
                border: 1px solid var(--line); border-left: 0; display: flex; align-items: center; }
  .band .src { margin-left: auto; padding-left: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* Controls */
  .ctrl { grid-area: ctrl; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select { font: 500 13px var(--body); color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
                   border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button.on { background: var(--text); color: var(--bg); }
  button:hover { border-color: var(--muted); }
  .timeline { position: relative; height: 34px; }
  .timeline input { width: 100%; margin: 0; position: absolute; top: 12px; }
  .marks { position: absolute; inset: 0 0 auto 0; height: 12px; }
  .mark { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; cursor: pointer; line-height: 1; }
  .legend { font-size: 12px; color: var(--muted); }

  /* Side panel */
  .side { grid-area: side; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 32px); }
  .side h2 { font: 600 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .side h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ticker { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  .ticker li { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px; display: grid; gap: 3px; }
  .ticker li .meta { display: flex; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .ticker li .kind { text-transform: uppercase; letter-spacing: .06em; }
  .ticker li.k-incident .kind { color: var(--var); }
  .ticker li.k-goal .kind { color: var(--ok); }
  .ticker li.k-card .kind { color: var(--alert); }
  .ticker li .src { font-family: var(--mono); font-size: 10px; color: var(--muted); word-break: break-all; }
  .empty { padding: 14px; color: var(--muted); font-size: 13px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font-family: var(--display); font-size: 24px; letter-spacing: .1em; color: var(--muted); }
</style>
</head>
<body>
<div class="loading" id="loading">LOADING MATCH…</div>
<div class="wrap">
  <div class="top">
    <div class="bug">
      <div class="team" id="homeTeam"></div>
      <div class="score" id="score">0 – 0</div>
      <div class="team" id="awayTeam"></div>
      <div class="clock" id="clock">0:00</div>
    </div>
    <div class="meters">
      <div class="meter"><span>Possession · 5 min</span><div class="bar"><i id="possBar" style="width:50%"></i></div><div class="vals"><span id="possH">50</span><span id="possA">50</span></div></div>
      <div class="meter"><span>Pressure index</span><div class="bar"><i id="presBar" style="width:50%"></i></div><div class="vals"><span id="presH">–</span><span id="presA">–</span></div></div>
      <div class="meter"><span>Pass completion</span><div class="bar"><i id="ctrlBar" style="width:50%"></i></div><div class="vals"><span id="ctrlH">–</span><span id="ctrlA">–</span></div></div>
    </div>
    <div class="brand"><b>TOUCHLINE</b> PREVIEW</div>
  </div>

  <div class="stage">
    <svg class="pitch" id="pitch" viewBox="-3 -3 111 74" aria-label="Pitch"></svg>
    <div class="badge" id="varBadge"><span class="dot"></span><span id="varText">VAR CHECK</span></div>
    <div class="band" id="band"><div class="tag" id="bandTag"></div><div class="text"><span id="bandText"></span><span class="src" id="bandSrc"></span></div></div>
  </div>

  <div class="ctrl">
    <div class="row">
      <button id="play">▶ Play</button>
      <span class="legend">Speed</span>
      <span id="speeds"></span>
      <span class="legend" style="margin-left:auto">Scenario</span>
      <select id="scenario"><option value="golden">Golden match</option><option value="red_card">Red card</option><option value="late_comeback">Late comeback</option></select>
    </div>
    <div class="timeline"><div class="marks" id="marks"></div><input type="range" id="scrub" min="0" max="1" step="0.1" value="0" aria-label="Match time"></div>
    <div class="row legend" id="jumps"></div>
  </div>

  <aside class="side">
    <h2>Engine facts <small id="factCount"></small></h2>
    <ul class="ticker" id="ticker"><li class="empty">Press play. Every fact here is derived by the engine and cites the events it came from.</li></ul>
  </aside>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const params = new URLSearchParams(location.search);
  const scenario = params.get("s") || "golden";
  $("scenario").value = scenario;
  $("scenario").onchange = (e) => { location.search = "?s=" + e.target.value; };

  let D, players, nameOf, colour, t = 0, playing = false, speed = 10, lastNow = 0;
  let factIdx = 0, score = {}, metrics = null, varOpen = null, lines = null, band = null;

  const svg = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };

  function crest(code) {
    return `<svg class="crest" viewBox="0 0 22 26"><path d="M11 1 L21 4 V12 C21 19 16 23 11 25 C6 23 1 19 1 12 V4 Z" fill="${colour[code]}" stroke="rgba(0,0,0,.35)"/><text x="11" y="16" text-anchor="middle" font-size="8" font-family="Barlow Condensed" font-weight="700" fill="#0b0f14">${code[0]}</text></svg>`;
  }

  function drawPitch() {
    const p = $("pitch");
    for (let i = 0; i < 10; i++) svg("rect", { x: i * 10.5, y: 0, width: 10.5, height: 68, fill: i % 2 ? "var(--pitch)" : "var(--pitch-2)" }, p);
    const chalk = { fill: "none", stroke: "var(--chalk)", "stroke-width": 0.25 };
    svg("rect", { x: 0, y: 0, width: 105, height: 68, ...chalk }, p);
    svg("line", { x1: 52.5, y1: 0, x2: 52.5, y2: 68, ...chalk }, p);
    svg("circle", { cx: 52.5, cy: 34, r: 9.15, ...chalk }, p);
    for (const x of [0, 105]) {
      const s = x ? -1 : 1;
      svg("rect", { x: x ? 105 - 16.5 : 0, y: 13.84, width: 16.5, height: 40.32, ...chalk }, p);
      svg("rect", { x: x ? 105 - 5.5 : 0, y: 24.84, width: 5.5, height: 18.32, ...chalk }, p);
      svg("rect", { x: x ? 105 : -1.5, y: 30.34, width: 1.5, height: 7.32, ...chalk }, p);
      svg("circle", { cx: x + s * 11, cy: 34, r: 0.25, fill: "var(--chalk)" }, p);
    }
    svg("g", { id: "lines" }, p);
    const g = svg("g", { id: "players" }, p);
    players.forEach((pid) => {
      const team = pid.slice(0, 3);
      const n = pid.split("-")[1];
      const node = svg("g", { "data-pid": pid }, g);
      svg("circle", { r: 1.25, fill: colour[team], stroke: n === "1" ? "#fff" : "rgba(0,0,0,.45)", "stroke-width": n === "1" ? 0.35 : 0.2 }, node);
      const label = svg("text", { "text-anchor": "middle", y: 0.55, "font-size": 1.5, "font-family": "IBM Plex Mono", "font-weight": 600, fill: "#0b0f14" }, node);
      label.textContent = n;
    });
    svg("circle", { id: "ball", r: 0.6, fill: "#fff", stroke: "#0b0f14", "stroke-width": 0.15 }, p);
    svg("g", { id: "tags" }, p);
  }

  function frameAt(time) {
    const F = D.frames;
    let lo = 0, hi = F.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (F[mid][0] <= time) lo = mid; else hi = mid - 1; }
    const a = F[lo], b = F[Math.min(lo + 1, F.length - 1)];
    const span = b[0] - a[0];
    const k = span > 0 && span < 1.5 ? Math.min(1, Math.max(0, (time - a[0]) / span)) : 0;
    const lerp = (i) => (a[i] == null ? null : b[i] == null ? a[i] : a[i] + (b[i] - a[i]) * k);
    return { period: a[1], clock: a[2] + (b[2] - a[2]) * k, ball: [lerp(3), lerp(4)], pos: (j) => [lerp(5 + 2 * j), lerp(6 + 2 * j)] };
  }

  function clockText(period, clock) {
    const base = period === 1 ? 2700 : 5400;
    const m = Math.floor(clock / 60), s = Math.floor(clock % 60);
    if (clock >= base) {
      const extra = Math.floor((clock - base) / 60) + 1;
      return `${base / 60}+${extra}'`;
    }
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  const N = (pid) => (pid && nameOf[pid]) || pid || "";
  const pct = (v) => Math.round(v * 100);

  // Deterministic captions from engine facts. Agents replace these later; the facts stay the same.
  function caption(f) {
    const v = f.values;
    switch (f.kind) {
      case "sprint": return { tag: "Sprint", text: `${N(f.player)} hits ${v.peak_kmh} km/h`, prio: 2, tagFor: f.team };
      case "pass_quality": return { tag: `Pass ${pct(v.difficulty)}`, text: `${N(f.player)} → ${N(v.receiver)} · ${v.length_m} m, difficulty ${pct(v.difficulty)}/100${v.lane_defenders ? `, past ${v.lane_defenders} defender${v.lane_defenders > 1 ? "s" : ""}` : ""}`, prio: 1, tagFor: f.team };
      case "shot": return { tag: v.outcome === "goal" ? "Shot" : v.outcome.replace("_", " "), text: `${N(f.player)} from ${v.distance_m} m · ${v.ball_speed_kmh} km/h`, prio: 3, tagFor: f.team };
      case "goal": return v.disallowed
        ? { tag: "No goal", text: `${D.teams[f.team].name} goal ruled out · ${score[D.home]}–${score[D.away]}`, prio: 6, tagFor: f.team }
        : { tag: "Goal", text: `${N(f.player)} scores for ${D.teams[f.team].name}`, prio: 5, tagFor: f.team };
      case "card": return { tag: `${v.outcome} card`, text: N(f.player), prio: 4, tagFor: f.team, alert: true };
      case "pressure_swing": return { tag: `Pressure ${v.pressure}`, text: `${D.teams[f.team].name} squeezing: ${v.pressure} pressure index, ${v.possession}% possession`, prio: 2, tagFor: f.team };
      case "incident": {
        if (v.state === "reviewing") return { tag: "VAR", text: `Checking: possible ${v.kind.replace("_", " ")}. On-field call: ${v.on_field}.`, prio: 6, var: true };
        if (v.state === "decided" && v.kind === "offside" && v.facts.margin_m != null && v.var_outcome)
          return { tag: v.final === "no_goal" ? "No goal" : v.final, text: `Offside · ${N(v.facts.attacker)} ${Math.round(v.facts.margin_m * 100)} cm ahead of ${N(v.facts.defender)} at the pass`, prio: 7, var: true };
        if (v.state === "decided" && v.kind === "red_card" && v.var_outcome) return { tag: "VAR", text: `Red card ${v.var_outcome} · ${N(v.facts.offender)}`, prio: 7, var: true };
        if (v.state === "decided" && v.kind === "offside") return { tag: "Offside", text: `Flag up: ${N(v.facts.attacker)}`, prio: 3 };
        return null;
      }
      default: return null;
    }
  }

  function tickerItem(f) {
    if (f.kind === "metrics") return null;
    if (f.kind === "incident" && f.values.kind === "goal_check" && f.values.state !== "reviewing") return null;
    const c = caption(f);
    const li = document.createElement("li");
    li.className = "k-" + f.kind;
    const what = c ? `${c.tag} — ${c.text}` : `${f.values.kind} → ${f.values.state}`;
    const stateNote = f.kind === "incident" ? ` · state: ${f.values.state}` : "";
    li.innerHTML = `<div class="meta"><span>${clockText(f.period, f.clock)}</span><span class="kind">${f.kind.replace("_", " ")}</span></div><div>${what}${stateNote}</div><div class="src">${f.sources.join(" · ")}</div>`;
    return li;
  }

  function applyFact(f, live) {
    const v = f.values;
    if (f.kind === "goal") score = { ...v.score };
    if (f.kind === "metrics") metrics = v;
    if (f.kind === "incident") {
      if (v.state === "reviewing") varOpen = v;
      if (v.state === "decided" && varOpen && varOpen.incident_id === v.incident_id) varOpen = null;
      if (v.state === "decided" && v.kind === "offside" && v.var_outcome && v.facts.attacker_x != null)
        lines = { until: f.t + 14, ax: v.facts.attacker_x, dx: v.facts.defender_x };
    }
    if (!live) return;
    const c = caption(f);
    if (c && (!band || f.t > band.until || c.prio >= band.prio)) band = { ...c, until: f.t + (c.prio >= 6 ? 10 : 6), src: f.sources.slice(0, 3).join(" · ") };
    const li = tickerItem(f);
    if (li) {
      const tk = $("ticker");
      if (tk.firstChild && tk.firstChild.classList.contains("empty")) tk.innerHTML = "";
      tk.insertBefore(li, tk.firstChild);
      while (tk.children.length > 120) tk.removeChild(tk.lastChild);
    }
  }

  function seek(to) {
    t = to; factIdx = 0; score = { [D.home]: 0, [D.away]: 0 }; metrics = null; varOpen = null; lines = null; band = null;
    $("ticker").innerHTML = "";
    const recent = [];
    while (factIdx < D.facts.length && D.facts[factIdx].t <= t) {
      const f = D.facts[factIdx++];
      applyFact(f, false);
      if (f.t > t - 600) recent.push(f);
    }
    recent.slice(-40).forEach((f) => { const li = tickerItem(f); if (li) $("ticker").insertBefore(li, $("ticker").firstChild); });
    if (!$("ticker").children.length) $("ticker").innerHTML = '<li class="empty">No facts yet.</li>';
    render();
  }

  function render() {
    const fr = frameAt(t);
    const g = $("players").children;
    for (let j = 0; j < players.length; j++) {
      const [x, y] = fr.pos(j);
      if (x == null) g[j].setAttribute("display", "none");
      else { g[j].removeAttribute("display"); g[j].setAttribute("transform", `translate(${x.toFixed(2)},${y.toFixed(2)})`); }
    }
    $("ball").setAttribute("cx", fr.ball[0]); $("ball").setAttribute("cy", fr.ball[1]);
    $("clock").textContent = (fr.period === 1 ? "1H " : "2H ") + clockText(fr.period, fr.clock);
    $("score").textContent = `${score[D.home] ?? 0} – ${score[D.away] ?? 0}`;

    if (metrics) {
      const H = metrics[D.home], A = metrics[D.away];
      $("possBar").style.width = H.possession + "%"; $("possH").textContent = H.possession; $("possA").textContent = A.possession;
      const ps = H.pressure + A.pressure || 1;
      $("presBar").style.width = (100 * H.pressure / ps) + "%"; $("presH").textContent = H.pressure; $("presA").textContent = A.pressure;
      const cs = H.control + A.control || 1;
      $("ctrlBar").style.width = (100 * H.control / cs) + "%"; $("ctrlH").textContent = H.control + "%"; $("ctrlA").textContent = A.control + "%";
    }

    $("varBadge").classList.toggle("on", !!varOpen);
    if (varOpen) $("varText").textContent = `VAR CHECK · ${varOpen.kind.replace("_", " ").toUpperCase()}`;

    const L = $("lines");
    L.innerHTML = "";
    if (lines && t <= lines.until) {
      svg("line", { x1: lines.dx, y1: 0, x2: lines.dx, y2: 68, stroke: colour[D.away], "stroke-width": 0.3 }, L);
      svg("line", { x1: lines.ax, y1: 0, x2: lines.ax, y2: 68, stroke: colour[D.home], "stroke-width": 0.3, "stroke-dasharray": "1 0.6" }, L);
    }

    const on = band && t <= band.until;
    $("band").classList.toggle("on", !!on);
    if (on) {
      $("bandTag").textContent = band.tag;
      $("bandTag").style.background = band.var ? "var(--var)" : band.alert ? "var(--alert)" : colour[band.tagFor] || "var(--nbr)";
      $("bandText").textContent = band.text;
      $("bandSrc").textContent = band.src;
    }
    $("scrub").value = t;
    $("factCount").textContent = `· ${factIdx} so far`;
  }

  function loop(now) {
    if (playing) {
      const dt = Math.min(0.25, (now - lastNow) / 1000);
      t = Math.min(D.frames[D.frames.length - 1][0], t + dt * speed);
      while (factIdx < D.facts.length && D.facts[factIdx].t <= t) applyFact(D.facts[factIdx++], true);
      if (t >= D.frames[D.frames.length - 1][0]) { playing = false; $("play").textContent = "▶ Play"; }
      render();
    }
    lastNow = now;
    requestAnimationFrame(loop);
  }

  function controls() {
    $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Play"; };
    [1, 5, 10, 30, 60].forEach((s) => {
      const b = document.createElement("button");
      b.textContent = s + "×"; b.className = s === speed ? "on" : "";
      b.onclick = () => { speed = s; [...$("speeds").children].forEach((c) => c.classList.toggle("on", c === b)); };
      $("speeds").appendChild(b);
    });
    const end = D.frames[D.frames.length - 1][0];
    $("scrub").max = end;
    $("scrub").oninput = (e) => seek(parseFloat(e.target.value));

    const jumps = [];
    const ruledOut = new Set(D.facts.filter((f) => f.kind === "incident" && f.values.state === "decided" && f.values.final === "no_goal").map((f) => f.values.goal_event));
    D.facts.forEach((f) => {
      const v = f.values;
      let icon = null, label = null;
      if (f.kind === "goal" && !v.disallowed) { icon = "⚽"; label = `${clockText(f.period, f.clock)} Goal ${f.team}${ruledOut.has(f.sources[0]) ? " (ruled out)" : ""}`; }
      if (f.kind === "incident" && v.state === "reviewing") { icon = "◆"; label = `${clockText(f.period, f.clock)} VAR ${v.kind.replace("_", " ")}`; }
      if (f.kind === "card" && v.outcome === "red") { icon = "🟥"; label = `${clockText(f.period, f.clock)} Red card`; }
      if (!icon) return;
      const m = document.createElement("span");
      m.className = "mark"; m.textContent = icon; m.title = label; m.style.left = (100 * f.t / end) + "%";
      m.onclick = () => seek(Math.max(0, f.t - 20));
      $("marks").appendChild(m);
      jumps.push([f.t, label]);
    });
    $("jumps").innerHTML = "<span>Jump to:</span>";
    jumps.forEach(([ft, label]) => {
      const b = document.createElement("button");
      b.textContent = label; b.onclick = () => { seek(Math.max(0, ft - 20)); playing = true; $("play").textContent = "❚❚ Pause"; };
      $("jumps").appendChild(b);
    });
  }

  fetch(`data/${scenario}.json`).then((r) => {
    if (!r.ok) throw new Error(`data/${scenario}.json not found: run  uv run python -m engine.export`);
    return r.json();
  }).then((data) => {
    D = data;
    players = D.players;
    nameOf = Object.assign({}, ...Object.values(D.teams).map((t) => t.players));
    colour = Object.fromEntries(Object.entries(D.teams).map(([k, v]) => [k, v.colour]));
    $("homeTeam").innerHTML = crest(D.home) + D.home;
    $("awayTeam").innerHTML = D.away + crest(D.away);
    drawPitch();
    controls();
    seek(0);
    $("loading").remove();
    requestAnimationFrame((now) => { lastNow = now; loop(now); });
  }).catch((err) => { $("loading").textContent = err.message; });
})();
</script>
</body>
</html>
