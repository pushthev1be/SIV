[project]
name = "var-narrative"
version = "0.1.0"
description = "Multi-agent system that makes VAR checks and calls understandable for fans, grounded in the match data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "azure-eventhub==5.15.1",
    "azure-identity==1.26.0",
    "mcp[cli]>=1.20,<2",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "playwright>=1.50",
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "contracts", "sim", "engine", "agents", "mcp_server", "orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "config", "contracts", "engine", "mcp_server", "orchestrator", "sim"]
